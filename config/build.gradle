// build.gradle (android/app/build.gradle)
// Configuración de compilación para publicación en Google Play Store

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// ── Leer credenciales de firma desde archivo externo (NUNCA subir key.properties a git) ──
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.marjorie.todo_app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId = "com.marjorie.todo_app"   // ID único en Play Store
        minSdk = 21                                // Android 5.0+ (cubre 99% de dispositivos)
        targetSdk = 34                             // Android 14 (versión objetivo)
        versionCode = flutter.versionCode          // Número entero, incrementar en cada release
        versionName = flutter.versionName          // Versión legible: "1.0.0"
    }

    // ── Configuración de firma digital ──────────────────────────────────────
    signingConfigs {
        release {
            // Las credenciales se leen de key.properties (fuera del control de versiones)
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    buildTypes {
        // ── Build de depuración ──────────────────────────────────────────────
        debug {
            applicationIdSuffix ".debug"   // Permite instalar debug y release simultáneamente
            debuggable true
        }

        // ── Build de producción (Play Store) ────────────────────────────────
        release {
            signingConfig = signingConfigs.release
            minifyEnabled true              // Reduce tamaño eliminando código no usado
            shrinkResources true            // Elimina recursos no referenciados
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}
